
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <h1>Jogo de Adivinhação</h1>

        <p class="mensagem-inicial">
            Estou pensando em um número entre 1 e 100.
            Será que você consegue descobrir?
        </p>

        <input
            type="number"
            id="palpite"
            placeholder="Digite seu palpite"
            min="1"
            max="100"
        >

        <button onclick = "jogo()" id="chutar">Chutar</button>

        <p id="mensagens">Boa sorte!</p>

        <p id="tentativas">Tentativas restantes: 10</p>

    </main>

</body>
</html>
